<script>
/* ===== MRP CORE: importador da planilha + motor de cálculo ===== */
const MRPCore = (function () {
  const DAY = 86400000;
  // ---------- datas ----------
  function iso(d) { return d.toISOString().slice(0, 10); }
  function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  function addDays(s, n) { return iso(new Date(parseISO(s).getTime() + n * DAY)); }
  function diffDays(a, b) { return Math.round((parseISO(b) - parseISO(a)) / DAY); } // b - a
  function serialToISO(v) {
    if (typeof v === 'number' && v > 20000 && v < 80000) return iso(new Date(Date.UTC(1899, 11, 30) + Math.round(v) * DAY));
    if (typeof v === 'string') {
      const m = v.match(/(\d{2})\/(\d{2})\/(\d{4})/);
      if (m) return `${m[3]}-${m[2]}-${m[1]}`;
      if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
    }
    if (v instanceof Date && !isNaN(v)) return iso(new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate())));
    return null;
  }
  function todayISO() { const n = new Date(); return iso(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()))); }
  const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; if (typeof v === 'string') { const x = parseFloat(v.replace(/\./g, '').replace(',', '.')); return isFinite(x) ? x : 0; } return 0; };
  const str = v => (v === null || v === undefined) ? '' : String(v).trim();
  const clean = v => { const s = str(v); return (s === '****' || s === '-' || s === '0x7') ? '' : s; };

  // ---------- modelo vazio ----------
  function emptyDB() {
    return {
      settings: {
        horizonte: 240, segurancaDias: 30, coberturaDias: 60, leadTimePadrao: 45, transitPadrao: 35,
        desembaracoDias: 0, intervaloEntrega: 0, familias: {}, cbmContainer: 68, containers: { "20'": 28, "40'": 58 }, pesoMaxContainer: { "20'": 25000, "40'": 26500, '40HC': 26500 }, containerPadrao: '40HC', medidasUrl: '', estoqueSomarAcabados: true, fatoresPacote: { PBG: { '1': 8, '3': 22, '5': 36 }, PAG: { '1': 8, '3': 22, '5': 36 } }, coberturaMaxDias: 180, janelaCaronaDias: 60, incluirSimulacoes: true, dataBase: '',
        cambio: { USD: 5.40, CNY: 0.76, BRL: 1 }, cambioFonte: 'comercial', cambioMargem: 0, cambioInfo: null, workerUrl: ''
      },
      produtos: [],     // itens comprados (MP)
      estrutura: [],    // {pa, mp, qtd}
      previsao: [],     // {pa, grupo, padrao, meses:{'YYYY-MM': taxaDia}}
      ordens: [],       // linhas de ordem de compra
      embarques: [],    // follow-up de navios
      fornecedores: [], // {nome, leadTime, transitTime, moeda, contato, linha}
      vendas: null,     // vendas efetivas agregadas por SKU/dia
      estoqueSnap: null, // último relatório de estoque corrente (saldo por SKU)
      medidasTab: null,  // tabela de medidas importada {codigo: {peso, m3}}
      historico: [],     // histórico de alterações das ordens de compra
      estoqueAtualizadoEm: null
    };
  }

  // ---------- importador da planilha atual (SheetJS workbook) ----------
  function sheetRows(XLSX, wb, name) {
    const ws = wb.Sheets[name];
    if (!ws || !ws['!ref']) return null;
    const rg = XLSX.utils.decode_range(ws['!ref']); rg.s.c = 0; rg.s.r = 0; // índices absolutos (coluna A = 0)
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true, range: rg });
  }
  const statusMap = { in_production: 'Em produção', in_transit: 'Em trânsito', in_stock: 'Recebido', simulation: 'Simulação' };
  function normSupplier(s) { return str(s).toUpperCase().replace(/_/g, ' ').replace(/\s+/g, ' ').trim(); }

  function importWorkbook(XLSX, wb) {
    const db = emptyDB();
    const log = [];
    const prodMap = new Map();
    const getProd = cod => {
      cod = str(cod); if (!cod) return null;
      if (!prodMap.has(cod)) prodMap.set(cod, { cod, desc: '', familia: '', fornecedor: '', leadTime: null, transitTime: null, multiplo: 1, pcsCx: null, cbmCx: null, custo: 0, moeda: 'USD', estoque: 0, segurancaDias: null, coberturaDias: null, ativo: true, mrp: false });
      return prodMap.get(cod);
    };

    // MRP: lista de itens planejados + família
    const mrp = sheetRows(XLSX, wb, 'MRP');
    if (mrp) {
      let n = 0;
      mrp.forEach(r => { if (r && str(r[2]) === 'Actual' && str(r[1])) { const p = getProd(r[1]); p.familia = str(r[0]).replace(/^PA_/, '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim(); p.mrp = true; n++; } });
      log.push(`MRP: ${n} itens planejados`);
    }
    // Estrutura
    const st = sheetRows(XLSX, wb, 'Structure');
    if (st) {
      const hdr = st.findIndex(r => r && str(r[0]) === 'Produto Pai');
      for (let i = hdr + 1; i < st.length; i++) {
        const r = st[i]; if (!r || !str(r[0]) || !str(r[1])) continue;
        db.estrutura.push({ pa: str(r[0]), mp: str(r[1]), qtd: num(r[2]) || 1 });
      }
      log.push(`Estrutura: ${db.estrutura.length} vínculos produto → componente`);
    }
    // Previsão (diária → taxa média por mês)
    const fc = sheetRows(XLSX, wb, 'Forecast');
    if (fc) {
      const hdr = fc.findIndex(r => r && str(r[1]) === 'Forecast');
      const dates = (fc[hdr] || []).map(v => serialToISO(v));
      for (let i = hdr + 1; i < fc.length; i++) {
        const r = fc[i]; if (!r || !str(r[1])) continue;
        const acc = {};
        for (let c = 3; c < r.length; c++) {
          const d = dates[c]; if (!d) continue;
          const ym = d.slice(0, 7);
          (acc[ym] = acc[ym] || { s: 0, n: 0 });
          acc[ym].s += num(r[c]); acc[ym].n++;
        }
        const meses = {};
        Object.keys(acc).sort().forEach(ym => { meses[ym] = Math.round((acc[ym].s / acc[ym].n) * 100) / 100; });
        const ks = Object.keys(meses).sort();
        const padrao = ks.length ? meses[ks[ks.length - 1]] : 0;
        db.previsao.push({ pa: str(r[1]), grupo: str(r[2]).replace(/_/g, ' '), padrao, meses });
      }
      log.push(`Previsão: ${db.previsao.length} produtos de venda`);
    }
    // Estoque por componente
    const ss = sheetRows(XLSX, wb, 'Stock_Structure');
    if (ss) {
      let n = 0; const seen = new Set();
      ss.forEach(r => {
        if (!r || !['PA', 'MP'].includes(str(r[0]))) return;
        const cod = str(r[2]); if (!cod || seen.has(cod)) return;
        seen.add(cod);
        if (prodMap.has(cod)) { prodMap.get(cod).estoque = num(r[3]); n++; }
      });
      const fl = sheetRows(XLSX, wb, 'Stock_MP_Floors');
      if (fl) fl.forEach(r => { if (r && prodMap.has(str(r[0])) && typeof r[3] === 'number') prodMap.get(str(r[0])).estoque = num(r[3]); });
      log.push(`Estoque: ${n} itens com saldo importado`);
    }
    // Descrições do sistema (export do ERP)
    const sys = sheetRows(XLSX, wb, 'Stock_System');
    if (sys) {
      sys.forEach(r => { if (r && str(r[0]) && prodMap.has(str(r[0]))) { const p = prodMap.get(str(r[0])); if (!p.desc) p.desc = str(r[1]); } });
    }
    // Custos
    const co = sheetRows(XLSX, wb, 'COSTS');
    if (co) {
      const hdr = co.findIndex(r => r && str(r[0]) === 'Cód');
      for (let i = hdr + 1; i < co.length; i++) {
        const r = co[i]; if (!r || !str(r[0])) continue;
        const p = prodMap.get(str(r[0])); if (!p) continue;
        const moeda = str(r[3]).toUpperCase();
        const m = moeda.includes('IUAN') || moeda.includes('YUAN') || moeda.includes('RENM') ? 'CNY' : moeda.includes('REAL') ? 'BRL' : 'USD';
        (p.cotacoes = p.cotacoes || []).push({ fornecedor: normSupplier(r[2]), moeda: m, custo: num(r[7]) });
      }
      prodMap.forEach(p => {
        const cs = (p.cotacoes || []).filter(c => c.custo > 0); if (!cs.length) return;
        if (!p.fornecedor) p.fornecedor = cs[0].fornecedor;
        const c = cs.find(x => x.fornecedor === p.fornecedor) || cs[0];
        p.custo = c.custo; p.moeda = c.moeda;
        p.cotacoes = cs;
      });
    }
    // CBM / embalagem
    const cb = sheetRows(XLSX, wb, 'Tab_CBM');
    if (cb) {
      cb.forEach(r => { if (!r) return; const p = prodMap.get(str(r[0])); if (!p) return; if (num(r[1])) p.pcsCx = num(r[1]); if (num(r[3])) p.cbmCx = num(r[3]); });
    }
    // Ordens de compra
    const po = sheetRows(XLSX, wb, 'Purchase_Order');
    const supLT = {};
    if (po) {
      const hdr = po.findIndex(r => r && str(r[6]) === 'Item' && str(r[7]) === 'PO_Date');
      for (let i = hdr + 1; i < po.length; i++) {
        const r = po[i]; if (!r || !str(r[6])) continue;
        const qtd = num(r[9]) || num(r[8]);
        const forn = normSupplier(r[4]);
        const lt = num(r[10]), tt = num(r[12]);
        if (forn && lt) supLT[forn] = { leadTime: lt, transitTime: tt };
        const p = getProd(r[6]);
        if (!p.fornecedor && forn) p.fornecedor = forn;
        if (!p.familia && str(r[3])) p.familia = str(r[3]);
        if (num(r[20]) > 1) p.multiplo = num(r[20]);
        if (!qtd) continue;
        const st = statusMap[str(r[17]).toLowerCase()] || 'Em produção';
        db.ordens.push({
          id: 'po_' + i + '_' + Math.random().toString(36).slice(2, 7),
          po: str(r[5]), fornecedor: forn, item: str(r[6]), qtd,
          dataPedido: serialToISO(r[7]), leadTime: lt, dataEmbarque: serialToISO(r[11]), transitTime: tt,
          dataChegada: serialToISO(r[13]), qtdRecebida: str(r[17]).toLowerCase() === 'in_stock' ? qtd : 0,
          status: st, custoUnit: num(r[29]), moeda: (str(r[26]).toUpperCase().includes('IUAN') ? 'CNY' : 'USD'),
          responsavel: str(r[28]), obs: ''
        });
      }
      log.push(`Ordens de compra: ${db.ordens.length} linhas com quantidade`);
    }
    // Fornecedores
    const supNames = new Set();
    prodMap.forEach(p => { if (p.fornecedor) supNames.add(p.fornecedor); });
    db.ordens.forEach(o => o.fornecedor && supNames.add(o.fornecedor));
    const su = sheetRows(XLSX, wb, 'Suppliers');
    const supInfo = {};
    if (su) su.forEach(r => { if (r && str(r[2]) && str(r[2]) !== 'Suppliers' && isNaN(Number(str(r[2])))) { const n = normSupplier(r[2]); supNames.add(n); supInfo[n] = { contato: str(r[1]), linha: str(r[3]) }; } });
    db.fornecedores = [...supNames].sort().map(nome => ({
      nome, leadTime: supLT[nome]?.leadTime ?? null, transitTime: supLT[nome]?.transitTime ?? null,
      contato: supInfo[nome]?.contato || '', linha: supInfo[nome]?.linha || ''
    }));
    // Follow-up de embarques
    const fu = sheetRows(XLSX, wb, 'Follow-up');
    if (fu) {
      const hdr = fu.findIndex(r => r && str(r[0]).startsWith('AGENTE'));
      for (let i = hdr + 1; i < fu.length; i++) {
        const r = fu[i]; if (!r || !str(r[0])) continue;
        db.embarques.push({
          id: 'emb_' + i + '_' + Math.random().toString(36).slice(2, 7),
          agente: clean(r[0]), porto: clean(r[1]), navio: clean(r[2]),
          prevChegada: serialToISO(clean(r[3]).replace(/PREV\.?\s*/i, '')) || '', atracacao: serialToISO(r[5]) || '',
          refImp: clean(r[6]), po: clean(r[8]).replace(/\.0$/, ''), bl: clean(r[9]), fornecedor: normSupplier(clean(r[10])),
          dataEmbarque: serialToISO(r[11]) || '', freeTime: num(r[12]) || '', containers: num(r[13]) || '',
          rastreioDocs: clean(r[15]), status: clean(r[17])
        });
      }
      log.push(`Embarques: ${db.embarques.length} processos`);
    }
    db.produtos = [...prodMap.values()].filter(p => p.mrp || db.ordens.some(o => o.item === p.cod)).sort((a, b) => (a.familia + a.cod).localeCompare(b.familia + b.cod));
    db.estoqueAtualizadoEm = null; // estoque veio da planilha; atualizar pelo export do ERP
    log.push(`Itens no cadastro: ${db.produtos.length}`);
    return { db, log };
  }

  // Atualização de estoque a partir de export do ERP (SKU + Total disponível)
  function importStock(XLSX, wb, db) {
    const ws = wb.Sheets[wb.SheetNames.find(n => /stock|estoque/i.test(n)) || wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
    let hdr = -1, cSku = -1, cQtd = -1;
    for (let i = 0; i < Math.min(rows.length, 20); i++) {
      const r = (rows[i] || []).map(x => str(x).toLowerCase());
      const s = r.findIndex(x => x === 'sku' || x === 'código' || x === 'codigo' || x === 'cód' || x === 'cod');
      let q = r.findIndex(x => x === 'total disponível' || x === 'total disponivel');
      if (q < 0) q = r.findIndex(x => x.includes('dispon') || x === 'estoque' || x === 'saldo' || x === 'quantidade');
      if (s >= 0 && q >= 0) { hdr = i; cSku = s; cQtd = q; break; }
    }
    if (hdr < 0) throw new Error('Não encontrei as colunas "SKU" e "Total disponível" (ou "Estoque"/"Saldo").');
    const map = new Map();
    for (let i = hdr + 1; i < rows.length; i++) { const r = rows[i]; if (r && str(r[cSku])) map.set(str(r[cSku]), num(r[cQtd])); }
    let n = 0; const faltando = [];
    db.produtos.forEach(p => { if (map.has(p.cod)) { p.estoque = map.get(p.cod); n++; } else faltando.push(p.cod); });
    db.estoqueAtualizadoEm = todayISO();
    return { atualizados: n, faltando };
  }

  // ---------- câmbio ----------
  // taxa usada para previsões (câmbio atual + margem de segurança configurável)
  function taxaPrevisao(db, moeda) {
    moeda = moeda || 'USD'; if (moeda === 'BRL') return 1;
    const base = num(db.settings.cambio?.[moeda]); return base * (1 + num(db.settings.cambioMargem) / 100);
  }
  // valor de uma linha de ordem em R$: usa o câmbio pago quando informado, senão o de previsão
  function valorOrdem(db, o, prod) {
    const cu = num(o.custoUnit) || num(prod?.custo);
    const moeda = num(o.custoUnit) ? (o.moeda || 'USD') : (prod?.moeda || 'USD');
    const pago = num(o.cambioPago) > 0 && moeda !== 'BRL';
    const taxa = moeda === 'BRL' ? 1 : pago ? num(o.cambioPago) : taxaPrevisao(db, moeda);
    const aberto = Math.max(0, num(o.qtd) - num(o.qtdRecebida));

/* ===== MRP: grade dia a dia (estilo planilha) ===== */
const MESC = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
function gradeLinhas(x, N, gran) {
  const t = R.opts.today, H = R.opts.horizonte;
  const ped = new Array(H + 1).fill(0), emb = new Array(H + 1).fill(0), sug = new Array(H + 1).fill(0);
  x.abertas.forEach(o => { const a = o.dataPedido ? C.diffDays(t, o.dataPedido) : -1, b = o.dataEmbarque ? C.diffDays(t, o.dataEmbarque) : -1; if (a >= 0 && a <= H) ped[a] += o.aberto; if (b >= 0 && b <= H) emb[b] += o.aberto; });
  x.plano.forEach(pl => (pl.parcelas && pl.parcelas.length ? pl.parcelas : [{ dataChegada: pl.dataChegada, qtd: pl.qtd }]).forEach(pc => { const d = C.diffDays(t, pc.dataChegada); if (d >= 0 && d <= H) sug[d] += pc.qtd; }));
  // dias de estoque: estoque do dia ÷ demanda média dos 30 dias seguintes
  const P = [0]; for (let d = 0; d <= H; d++) P.push(P[d] + x.rates[d]);
  const dias = x.S.map((v, d) => { const e = Math.min(H + 1, d + 30), n = e - d, m = n > 0 ? (P[e] - P[d]) / n : 0; return m > 0 ? v / m : null; });
  const cols = []; if (gran === 'semana') { for (let d = 0; d < N; d += 7) cols.push([d, Math.min(N, d + 7) - 1]); } else for (let d = 0; d < N; d++) cols.push([d, d]);

// distribui a quantidade final entre as parcelas, na proporção do plano do MRP
function dividirParcelas(l) {
  const P = l.parcelas; if (!P || P.length < 2) return [{ dataChegada: l.dataChegada, qtd: l.qFinal, dia: null }];
  const ref = P.reduce((a, pc) => a + pc.qtd, 0) || 1, mult = l.mult || 1;
  const out = P.map(pc => ({ ...pc, qtd: Math.floor((l.qFinal * pc.qtd / ref) / mult) * mult }));
  out[0].qtd += l.qFinal - out.reduce((a, pc) => a + pc.qtd, 0);
  return out.filter(pc => pc.qtd > 0);
}
function criarPlanejada(cods) {

    const qtd = l ? l.qFinal : ((ui.sugQtd || {})[cod] ?? x.prox?.qtd);
    if (!qtd) return;

    const orig = l?.origem === 'carona' ? ' (carona)' : l?.origem === 'complemento' ? ' (complemento de container/pedido mínimo)' : '';
    const parts = l ? dividirParcelas({ ...l, qFinal: qtd }) : (x.prox?.parcelas?.length > 1 ? dividirParcelas({ parcelas: x.prox.parcelas, qFinal: qtd, mult: x.prm.mult, dataChegada: x.prox.dataChegada }) : [{ qtd, dia: null }]);
    const d0 = parts[0].dia;
    parts.forEach((pc, j) => {
      const desloc = pc.dia !== null && pc.dia !== undefined && d0 !== null && d0 !== undefined ? pc.dia - d0 : 0;
      const cheg = C.addDays(dp, x.prm.LT + desloc);
      DB.ordens.push({ id: uid('po'), po: 'PLAN-' + t.replace(/-/g, '').slice(2), fornecedor: x.produto.fornecedor, item: cod, qtd: pc.qtd, dataPedido: dp, leadTime: x.prm.leadTime + desloc, dataEmbarque: C.addDays(cheg, -(x.prm.transitTime + x.prm.desembaraco)), transitTime: x.prm.transitTime, dataChegada: cheg, qtdRecebida: 0, status: 'Planejada', custoUnit: C.num(x.produto.custo), moeda: x.produto.moeda, cambioPago: null, responsavel: user?.email || '', obs: 'Gerada pela sugestão do MRP' + orig + (parts.length > 1 ? ` — entrega ${j + 1}/${parts.length}` : '') });

    <td class="px-2 num">${r.valorLiberado ? brl.format(r.valorLiberado) : '–'}</td><td class="px-2 whitespace-normal min-w-[280px] text-slate-600">${esc(r.motivo)}</td></tr>`; }).join('') || '<tr><td colspan=11 class="p-4 text-slate-400">Nenhuma ordem para revisar com esta demanda — as ordens em aberto estão alinhadas à necessidade.</td></tr>'}
  </tbody></table></div>`;
}
function aplicarRevisao() {
  const all = R.revisao || [];
  const sel = [...document.querySelectorAll('.revck:checked')].map(c => all[Number(c.value)]).filter(Boolean);
  if (!sel.length) { toast('Selecione as ordens'); return; }
  const c = { cancelar: 0, reduzir: 0, postergar: 0 }; sel.forEach(r => c[r.acao]++);
  if (!confirm(`Aplicar nas ordens selecionadas?\n\n${c.cancelar} cancelamento(s) · ${c.reduzir} redução(ões) · ${c.postergar} postergação(ões)\nLibera ≈ ${brl.format(sel.reduce((a, r) => a + r.valorLiberado, 0))}\n\nAs ordens canceladas ficam com status "Cancelado" (não são apagadas). Lembre de comunicar o fornecedor.`)) return;
  const hojeBr = fd(C.todayISO());
  window._histMotivo = new Map(sel.map(r => [r.ordem.id, `${REV_LBL[r.acao][0]} (base: ${ui.rev.base === 'real' ? 'ritmo real' : 'previsão'}) — ${r.motivo}`]));
  sel.forEach(r => {
    const o = DB.ordens.find(z => z.id === r.ordem.id); if (!o) return;
    if (r.acao === 'cancelar') { o.status = 'Cancelado'; o.obs = `${o.obs ? o.obs + ' · ' : ''}Cancelada pela revisão em ${hojeBr}`; return; }
    if (r.novaChegada) {
      const desl = C.diffDays(o.dataChegada || r.chegadaAtual, r.novaChegada);
      o.dataChegada = r.novaChegada;
      if (o.dataEmbarque) o.dataEmbarque = C.addDays(o.dataEmbarque, desl);
      if (['Planejada', 'Simulação'].includes(o.status) && o.dataPedido) { const np = C.addDays(o.dataPedido, desl); o.dataPedido = np < C.todayISO() ? C.todayISO() : np; }
      o.obs = `${o.obs ? o.obs + ' · ' : ''}Postergada +${desl}d pela revisão em ${hojeBr}`;
    }
    if (r.qtdNova !== r.qtdAtual) { o.obs = `${o.obs ? o.obs + ' · ' : ''}Qtd ${o.qtd} → ${C.num(o.qtdRecebida) + r.qtdNova} pela revisão em ${hojeBr}`; o.qtd = C.num(o.qtdRecebida) + r.qtdNova; }
  });
  changed('ordens'); toast(`${sel.length} ordem(ns) atualizada(s)`);
}

/* ================= HISTÓRICO DAS ORDENS ================= */
const HIST_CAMPOS = { po: 'PO', fornecedor: 'Fornecedor', item: 'Item', qtd: 'Quantidade', qtdRecebida: 'Qtd recebida', dataPedido: 'Data do pedido', dataEmbarque: 'Embarque', dataChegada: 'Chegada', leadTime: 'Lead time', transitTime: 'Trânsito', status: 'Status', custoUnit: 'Custo unit.', moeda: 'Moeda', cambioPago: 'Câmbio pago' };
const HIST_MAX = 2500;
function snapOrdens() { return new Map(DB.ordens.map(o => [o.id, Object.fromEntries(Object.keys(HIST_CAMPOS).map(k => [k, o[k] ?? null]))])); }
const hNorm = v => (v === '' || v === undefined) ? null : (typeof v === 'number' ? Math.round(v * 10000) / 10000 : v);
// compara as ordens antes/depois de uma ação e grava o que mudou
function registrarHist(antes, origem, detalhe) {
  const depois = snapOrdens(), em = new Date().toISOString(), por = user?.email || 'este navegador', ev = [];
  const base = (sn, id) => ({ id: uid('h'), em, por, origem, ordemId: id, po: sn.po || '', item: sn.item || '', fornecedor: sn.fornecedor || '', obs: (window._histMotivo && window._histMotivo.get(id)) || detalhe || '' });
  depois.forEach((sn, id) => {
    const a = antes.get(id);
    if (!a) { ev.push({ ...base(sn, id), tipo: origem === 'desfazer exclusão' ? 'restauração' : 'criação', mudancas: [['qtd', null, sn.qtd], ['dataChegada', null, sn.dataChegada], ['status', null, sn.status]] }); return; }
    const m = Object.keys(HIST_CAMPOS).filter(k => hNorm(a[k]) !== hNorm(sn[k])).map(k => [k, a[k], sn[k]]);
    if (m.length) ev.push({ ...base(sn, id), tipo: m.some(x => x[0] === 'status' && x[2] === 'Cancelado') ? 'cancelamento' : 'alteração', mudancas: m });
  });
  antes.forEach((a, id) => { if (!depois.has(id)) ev.push({ ...base(a, id), tipo: 'exclusão', mudancas: [['qtd', a.qtd, null], ['dataChegada', a.dataChegada, null], ['status', a.status, null]] }); });
  window._histMotivo = null;
  if (!ev.length) return;
  DB.historico = [...(DB.historico || []), ...ev].slice(-HIST_MAX);
  Store.save('historico');
}
// envolve uma ação que mexe em ordens para registrar o histórico automaticamente
function comHist(origem, fn, detalhe) { return function (...args) { const antes = snapOrdens(); const det = detalhe ? detalhe(...args) : ''; const r = fn.apply(this, args); registrarHist(antes, origem, det); return r; }; }
saveOrdem = comHist('manual', saveOrdem);
delOrdem = comHist('manual', delOrdem);
excluirOrdens = comHist('exclusão em lote', excluirOrdens);
desfazerExclusao = comHist('desfazer exclusão', desfazerExclusao);
criarPlanejada = comHist('sugestão do MRP', criarPlanejada);
criarOrdensMP = comHist('montar pedido', criarOrdensMP);
aplicarRevisao = comHist('revisão do MRP', aplicarRevisao);
saveEmb = comHist('embarque', saveEmb, () => { const g = k => document.getElementById('ef_' + k)?.value || ''; return `Processo ${g('refImp') || '—'}${g('navio') ? ' · navio ' + g('navio') : ''}${g('prevChegada') ? ' · prev. chegada ' + fd(g('prevChegada')) : ''}${g('atracacao') ? ' · atracação ' + fd(g('atracacao')) : ''}`; });

const fmtHist = (k, v) => v === null || v === undefined || v === '' ? '—' : /^data/.test(k) ? fd(v) : typeof v === 'number' ? (k === 'cambioPago' || k === 'custoUnit' ? nf2.format(v) : f0(v)) : esc(v);
const HIST_TIPO = { 'criação': 'bg-emerald-100 text-emerald-700', 'alteração': 'bg-sky-100 text-sky-700', 'cancelamento': 'bg-red-100 text-red-700', 'exclusão': 'bg-red-50 text-red-600', 'restauração': 'bg-violet-100 text-violet-700', 'importação': 'bg-slate-100 text-slate-600' };
function histLinha(h, mostrarOrdem = true) {
  const dt = new Date(h.em);
  return `<tr class="border-t align-top"><td class="px-2 py-1.5 whitespace-nowrap">${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</td>
  <td class="px-2 whitespace-nowrap text-slate-500">${esc(h.por)}</td><td class="px-2"><span class="badge ${HIST_TIPO[h.tipo] || ''}">${esc(h.tipo)}</span><div class="text-[10px] text-slate-500 mt-0.5">${esc(h.origem)}</div></td>
  ${mostrarOrdem ? `<td class="px-2">${esc(h.po || '—')}</td><td class="px-2"><span class="text-sky-800 cursor-pointer hover:underline" onclick="openItem('${esc(h.item)}')">${esc(h.item)}</span><div class="text-[10px] text-slate-400">${esc(h.fornecedor)}</div></td>` : ''}
  <td class="px-2">${h.tipo === 'criação' || h.tipo === 'restauração' ? `qtd ${fmtHist('qtd', h.mudancas.find(m => m[0] === 'qtd')?.[2])} · chegada ${fmtHist('dataChegada', h.mudancas.find(m => m[0] === 'dataChegada')?.[2])} · ${fmtHist('status', h.mudancas.find(m => m[0] === 'status')?.[2])}` : h.tipo === 'exclusão' ? `qtd ${fmtHist('qtd', h.mudancas.find(m => m[0] === 'qtd')?.[1])} · chegada ${fmtHist('dataChegada', h.mudancas.find(m => m[0] === 'dataChegada')?.[1])}` : (h.mudancas || []).map(([k, a, b]) => `<div><span class="text-slate-500">${HIST_CAMPOS[k] || k}:</span> <span class="line-through text-slate-400">${fmtHist(k, a)}</span> → <b>${fmtHist(k, b)}</b></div>`).join('')}</td>
  <td class="px-2 whitespace-normal min-w-[220px] text-slate-600">${esc(h.obs || '')}</td></tr>`;
}
function histFiltrado() {
  const H = ui.hist, q = H.q.toLowerCase(), lim = H.periodo ? Date.now() - H.periodo * 864e5 : 0;
  return [...(DB.historico || [])].reverse().filter(h => (!q || `${h.po} ${h.item} ${h.fornecedor}`.toLowerCase().includes(q)) && (!H.origem || h.origem === H.origem || h.tipo === H.origem) && (!lim || new Date(h.em).getTime() >= lim));
}
function pgHistorico(el) {
  const H = ui.hist, rows = histFiltrado();
  const origens = uniq([...(DB.historico || []).map(h => h.origem), ...(DB.historico || []).map(h => h.tipo)]);
  el.innerHTML = `${ordTabs()}
  <div class="flex flex-wrap gap-2 mb-3 items-center">
    <input id="hq" placeholder="Buscar PO, item ou fornecedor" value="${esc(H.q)}" class="border rounded-lg px-3 py-1.5 w-64">
    <select class="border rounded-lg px-2 py-1.5" onchange="ui.hist.origem=this.value;render()"><option value="">Todas as origens e tipos</option>${origens.map(o => opt(o, H.origem)).join('')}</select>
    <select class="border rounded-lg px-2 py-1.5" onchange="ui.hist.periodo=Number(this.value);render()">${[[7, 'Últimos 7 dias'], [30, 'Últimos 30 dias'], [90, 'Últimos 90 dias'], [0, 'Todo o período']].map(([v, l]) => opt(v, H.periodo, l)).join('')}</select>
    <span class="text-xs text-slate-500">${rows.length} registro(s)</span>
    <button onclick="exportHist()" class="ml-auto border rounded-lg px-3 py-1.5 bg-white hover:bg-slate-50">Exportar Excel</button>
  </div>
  <div class="text-[11px] text-slate-500 mb-2">Registra automaticamente criação, alteração (datas, embarque, quantidade, status, custo, câmbio), cancelamento e exclusão de linhas de ordem — feitas à mão, em lote, pelo embarque, pelas sugestões/montar pedido ou pela revisão do MRP. Guarda os ${f0(HIST_MAX)} registros mais recentes.</div>
  <div class="bg-white rounded-xl shadow-sm border scroll-x" style="max-height:calc(100vh - 260px)"><table class="w-full tbl text-xs"><thead><tr class="text-left"><th class="px-2 py-2">Data/hora</th><th class="px-2">Usuário</th><th class="px-2">Tipo / origem</th><th class="px-2">PO</th><th class="px-2">Item</th><th class="px-2">O que mudou</th><th class="px-2">Observação / motivo</th></tr></thead><tbody>
  ${rows.slice(0, 1000).map(h => histLinha(h)).join('') || '<tr><td colspan=7 class="p-4 text-slate-400">Nenhum registro neste filtro. As alterações passam a ser registradas a partir de agora.</td></tr>'}
  </tbody></table></div>${rows.length > 1000 ? '<div class="text-xs text-slate-500 mt-2">Mostrando os 1.000 mais recentes — use os filtros ou exporte para ver todos.</div>' : ''}`;
  document.getElementById('hq').oninput = e => { H.q = e.target.value; clearTimeout(pgHistorico._t); pgHistorico._t = setTimeout(() => { render(); const i = document.getElementById('hq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 300); };
}
function exportHist() {
  const out = []; histFiltrado().forEach(h => { const base = { 'Data/hora': new Date(h.em).toLocaleString('pt-BR'), Usuário: h.por, Tipo: h.tipo, Origem: h.origem, PO: h.po, Item: h.item, Fornecedor: h.fornecedor, Observação: h.obs };
    (h.mudancas && h.mudancas.length ? h.mudancas : [[null, null, null]]).forEach(([k, a, b]) => out.push({ ...base, Campo: k ? HIST_CAMPOS[k] || k : '', De: a ?? '', Para: b ?? '' })); });
  xlsxDownload(`Historico_ordens_${C.todayISO()}.xlsx`, [['Histórico', out]]);

function urlGviz(u) {
  const m = String(u).match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/); if (!m) return null;
  const g = String(u).match(/[#&?]gid=(\d+)/); return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&gid=${g ? g[1] : 0}`;
}
async function buscarMedidasUrl() {
  const u = document.getElementById('medUrl').value.trim(), log = document.getElementById('logMed');
  const g = urlGviz(u); if (!g) { log.innerHTML = '<span class="text-red-600">Link de planilha Google inválido.</span>'; return; }
  log.textContent = 'Buscando planilha…';
  try {
    const r = await fetch(g); const t = await r.text();
    if (!r.ok || /^\s*</.test(t)) throw new Error('acesso negado');
    DB.settings.medidasUrl = u; aplicarMedidasUI(C.parseMedidasCSV(t), 'planilha Google');
  } catch (err) { log.innerHTML = `<span class="text-red-600">Não consegui ler a planilha (${esc(err.message)}). Verifique se ela está compartilhada como "Qualquer pessoa com o link pode ver" ou envie o arquivo baixado.</span>`; }
}

function mdLite(s) {
  s = esc(s);
  s = s.replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/(^|\n)((?:\|.*\|\n?)+)/g, (m, p, tb) => { const rows = tb.trim().split('\n').filter(r => !/^\|\s*-/.test(r)); return p + '<table>' + rows.map((r, i) => '<tr>' + r.split('|').slice(1, -1).map(c => i ? `<td>${c.trim()}</td>` : `<th>${c.trim()}</th>`).join('') + '</tr>').join('') + '</table>'; });
  s = s.replace(/(^|\n)((?:[-*] .*(?:\n|$))+)/g, (m, p, l) => p + '<ul>' + l.trim().split('\n').map(i => `<li>${i.replace(/^[-*] /, '')}</li>`).join('') + '</ul>');
  return s.split(/\n{2,}/).map(b => /^<(h3|ul|table)/.test(b) ? b : `<p>${b.replace(/\n/g, '<br>')}</p>`).join('');
}
async function perguntarIA() {
  const out = document.getElementById('iaOut'), btn = document.getElementById('iaBtn');
  out.classList.remove('hidden'); out.innerHTML = '<span class="text-slate-500">Analisando…</span>'; btn.disabled = true;
  try {
    const r = await fetch(DB.settings.workerUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pergunta: document.getElementById('iaQ').value, contexto: contextoIA() }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText);
    out.innerHTML = mdLite(j.resposta || '');
  } catch (e) { out.innerHTML = '<span class="text-red-600">Erro ao consultar a IA: ' + esc(e.message) + '</span>'; }
  btn.disabled = false;
}

function usarReal(skus) {

  if (!rows.length) { toast('Nenhum produto selecionado tem venda na janela'); return; }
  const ym = hoje().slice(0, 7);
  if (!confirm(`Gravar o ritmo real (média de ${V.nd} dias até ${fd(V.fim)}${ui.vendOpts.excluirB2B ? ', sem propostas comerciais' : ''}) como previsão padrão de ${rows.length} produto(s)?\n\nOs ajustes mensais a partir de ${ymLbl(ym)} desses produtos serão apagados. O MRP e as sugestões serão recalculados.`)) return;
  // códigos com previsão para os mesmos componentes que não vendem (ex.: _MKT) — evitar contar em dobro
  const alvo = new Set(rows.map(s => s.sku));
  const comps = new Set(rows.flatMap(s => s.comps.map(c => c.mp)));
  const duplos = DB.previsao.filter(f => !alvo.has(f.pa) && C.num(f.padrao) > 0 && !(DB.vendas.skus[f.pa]) && DB.estrutura.some(e => e.pa === f.pa && comps.has(e.mp)));
  let zerar = false;
  if (duplos.length) zerar = confirm(`Atenção: ${duplos.map(f => f.pa).join(', ')} também têm previsão para os mesmos componentes, mas não aparecem nas vendas (provavelmente código antigo).

Zerar a previsão deles para não contar a demanda em dobro? (OK = zerar, Cancelar = manter)`);
  if (zerar) duplos.forEach(f => { f.padrao = 0; Object.keys(f.meses || {}).forEach(k => { if (k >= ym) delete f.meses[k]; }); });
  rows.forEach(s => {
    let f = DB.previsao.find(z => z.pa === s.sku);
    if (!f) { f = { pa: s.sku, grupo: s.fam, padrao: 0, meses: {} }; DB.previsao.push(f); }
    f.padrao = Math.round(s.realDia * 100) / 100;
    Object.keys(f.meses || {}).forEach(k => { if (k >= ym) delete f.meses[k]; });
  });
  closeModal(); changed('previsao'); toast(`Previsão atualizada para ${rows.length} produto(s)${zerar ? ` · ${duplos.length} código(s) antigo(s) zerado(s)` : ''}`);

/* ================= CÂMBIO EM TEMPO REAL ================= */
async function buscarPTAX(moeda) {
  const d = new Date(), ini = new Date(d - 10 * 864e5), f = x => `${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}-${x.getFullYear()}`;
  const u = `https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoMoedaPeriodo(moeda=@moeda,dataInicial=@dataInicial,dataFinalCotacao=@dataFinalCotacao)?@moeda='${moeda}'&@dataInicial='${f(ini)}'&@dataFinalCotacao='${f(d)}'&$format=json&$select=cotacaoVenda,dataHoraCotacao,tipoBoletim`;
  const j = await fetch(u).then(r => { if (!r.ok) throw new Error('BCB ' + r.status); return r.json(); });
  const v = j.value || []; if (!v.length) throw new Error('BCB sem cotação de ' + moeda);
  const fech = v.filter(x => x.tipoBoletim === 'Fechamento'); const x = (fech.length ? fech : v)[(fech.length ? fech : v).length - 1];
  return { taxa: x.cotacaoVenda, ref: `${x.tipoBoletim} ${x.dataHoraCotacao.slice(8, 10)}/${x.dataHoraCotacao.slice(5, 7)} ${x.dataHoraCotacao.slice(11, 16)}` };
}
async function atualizarCambio(force) {
  const s = DB.settings; if (s.cambioFonte === 'manual') { if (force) toast('Fonte manual: informe os valores e salve'); return; }
  if (!force && s.cambioInfo?.em && s.cambioInfo.fonte === s.cambioFonte && Date.now() - new Date(s.cambioInfo.em) < 30 * 60000) return;
  try {
    let USD, CNY, ref;
    if (s.cambioFonte === 'ptax') {
      const [u, c] = await Promise.all([buscarPTAX('USD'), buscarPTAX('CNY')]);
      USD = u.taxa; CNY = c.taxa; ref = `PTAX venda · USD ${u.ref} · CNY ${c.ref}`;
    } else {
      const j = await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL,CNY-BRL').then(r => { if (!r.ok) throw new Error('AwesomeAPI ' + r.status); return r.json(); });
      USD = Number(j.USDBRL.ask); CNY = Number(j.CNYBRL.ask); ref = `Comercial venda · cotação de ${j.USDBRL.create_date.slice(8, 10)}/${j.USDBRL.create_date.slice(5, 7)} ${j.USDBRL.create_date.slice(11, 16)}`;
    }
    if (!(USD > 0) || !(CNY > 0)) throw new Error('cotação inválida');
    s.cambio = { ...s.cambio, USD: Math.round(USD * 10000) / 10000, CNY: Math.round(CNY * 10000) / 10000 };
    s.cambioInfo = { fonte: s.cambioFonte, em: new Date().toISOString(), ref };
    if (force) toast(`Câmbio atualizado: USD ${nf2.format(s.cambio.USD)} · CNY ${nf2.format(s.cambio.CNY)}`);
  } catch (e) {
    s.cambioInfo = { ...(s.cambioInfo || {}), erro: e.message };
    toast('Não consegui atualizar o câmbio (' + e.message + '). Usando o último valor salvo.', 4000);
  }
  recalc(); Store.save('settings'); render();
}

  atualizarCambio(false);
  setInterval(() => atualizarCambio(false), 30 * 60000);
})();
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== page && PAGES.some(p => p[0] === h)) { page = h; render(); } });

</script>
